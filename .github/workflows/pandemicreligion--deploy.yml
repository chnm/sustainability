name: "Deploy Static Websites -- pandemicreligion"

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Force-deploy one site, or 'all'"
        type: choice
        default: all
        options:
          - all
          - americanjewishlife.org
          - collectingthesetimes.org
          - hazon.collectingthesetimes.org
          - kahal.collectingthesetimes.org
          - onetable.collectingthesetimes.org
          - pandemicreligion.org
          - preachinggoesviral.org
  push:
    branches: ["**"]
    paths:
      - 'pandemicreligion/**'
      - '!.github/**'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history for git diff
      - id: set
        shell: python
        env:
          DISPATCH_SITE: ${{ github.event.inputs.site }}
          BEFORE: ${{ github.event.before }}
        run: |
          import json, os, subprocess

          # site -> dev FQDN. Prod FQDN == the live domain (the site key itself).
          DEV = {
              "americanjewishlife.org":            "americanjewishlife.dev.chnm.gmu.edu",
              "collectingthesetimes.org":          "collectingthesetimes.dev.chnm.gmu.edu",
              "hazon.collectingthesetimes.org":    "hazon.dev.chnm.gmu.edu",
              "kahal.collectingthesetimes.org":    "kahal.dev.chnm.gmu.edu",
              "onetable.collectingthesetimes.org": "onetable.dev.chnm.gmu.edu",
              "pandemicreligion.org":              "pandemicreligion.dev.chnm.gmu.edu",
              "preachinggoesviral.org":            "preachinggoesviral.dev.chnm.gmu.edu",
          }
          SITES = list(DEV)

          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True)

          dispatch = os.environ.get("DISPATCH_SITE", "")

          if dispatch and dispatch != "all":
              # workflow_dispatch: force one site
              candidates = [dispatch]
          elif dispatch == "all":
              # workflow_dispatch: force every site
              candidates = list(SITES)
          else:
              # push: deploy the sites whose files changed in this push.
              base = os.environ.get("BEFORE", "")
              no_base = (not base or set(base) == {"0"}                 # new branch: 000..0
                         or git("cat-file", "-e", f"{base}^{{commit}}").returncode != 0)
              diff = None if no_base else git("diff", "--name-only", base, "HEAD")
              if no_base or diff.returncode != 0:
                  # No usable diff base (new branch / force-push / shallow). This
                  # run was already gated by the on.push `paths:` filter, so deploy
                  # every committed site rather than silently deploying nothing.
                  print("no usable diff base -> deploying all present sites")
                  candidates = list(SITES)
              else:
                  changed = diff.stdout.splitlines()
                  candidates = [s for s in SITES
                                if any(f.startswith(f"pandemicreligion/{s}/") for f in changed)]

          # one matrix entry per candidate that actually has a committed directory
          # (keeps dispatch 'all' safe while only the pilot sites exist)
          include = []
          for s in candidates:
              if not os.path.isdir(f"pandemicreligion/{s}"):
                  print(f"skip {s} (no dir)")
                  continue
              include.append({
                  "site":         s,
                  "context_root": f"pandemicreligion/{s}",
                  "devl":         DEV[s],
                  "prod":         s,
              })

          matrix = json.dumps(include)
          print(f"matrix={matrix}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"matrix={matrix}\n")

  deploy:
    needs: detect
    if: ${{ needs.detect.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    uses: chnm/.github/.github/workflows/static--deploy.yml@main
    secrets: inherit
    with:
      context_root: ${{ matrix.context_root }}
      website-devl-fqdn: ${{ matrix.devl }}
      website-prod-fqdn: ${{ matrix.prod }}
      runner_labels: '["self-hosted","IncusOS"]'
