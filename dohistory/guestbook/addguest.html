    <title>Add to our Guestbook</title>  </head>  <body>    <center>      <h1>Add to our Guestbook</h1>    </center>    Fill in the blanks below to add to our guestbook.  The only blanks that you     have to fill in are the comments and name section.  Thanks!<hr>    <form method=POST action="/cgi-bin/guestbook/guestbook.pl">      Your Name:<input type=text name=realname size=30 aria-label="Your name"><br>      E-Mail: <input type=text name=username size=40 aria-label="Email"><br>      URL: <input type=text name=url size=50 aria-label="URL"><br>      City: <input type=text name=city size=15 aria-label="City">, State: <input type=text name=state size=2 aria-label="State"> Country: <input type=text value=USA name=country size=15 aria-label="Country"><p>      Comments:<br>      <textarea name=comments COLS=60 ROWS=4 aria-label="Comments"></textarea><p>      <input type=submit> * <input type=reset>    </form>    <hr>    * <a href="http://your.host.com/guestbook.html">Back to the Guestbook Entries</a><br>    Script and Guestbook Created by: <a href="http://worldwidemart.com/scripts/">Matt Wright</a>.  </body></html>
