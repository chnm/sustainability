    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/minisearch@7.1.2/dist/umd/index.min.js"></script>
</head>
<body>
<div class="notice" style="font-size: 12px; display: flex; align-items: center; background-color: #f8f8f8; padding: 10px; border: 1px solid #ddd; margin-bottom: 0;">
    <a href="https://rrchnm.org" target="_blank"><img src="/rrchnm_logo.png" alt="RRCHNM Logo" style="height: 30px; margin-right: 15px;"/></a>
    <div>
    This is a static copy of the final website maintained by the <a href="https://rrchnm.org" target="_blank">Roy Rosenzweig Center for History and New Media</a>. 
    </div>
</div>
    <script>
        const testDoc = {
            id: 1,
            title: "Test Title",
            content: "Test content with words"
        };

        const testSearch = new MiniSearch({
            fields: ['title', 'content']
        });

        console.log('Before:', testSearch.termCount);
        testSearch.add(testDoc);
        console.log('After:', testSearch.termCount);
        console.log('Terms:', Object.keys(testSearch.termCount));
        console.log('Search test:', testSearch.search('Test'));
    </script>
</body>
