<h1>DoHistory Site Search</H1><hr noshade size=4>This search will allow you to search the contents ofall the publicly available WWW documents at this site.<br><p><form method="post" action="/cgi-bin/htsearch"><font size=-1>Match: <select name=method aria-label="Method"><option value=and>All<option value=or>Any</select>Format: <select name=format aria-label="Format"><option value=builtin-long>Long<option value=builtin-short>Short</select>Sort by: <select name=sort aria-label="Sort"><option value=score>Score<option value=time>Time<option value=title>Title<option value=revscore>Reverse Score<option value=revtime>Reverse Time<option value=revtitle>Reverse Title</select></font><input type=hidden name=config value=dohistory><input type=hidden name=restrict value=""><input type=hidden name=exclude value=""><br>Search:<input type="text" size="30" name="words" value="" aria-label="Words"><input type="submit" value="Search"></form><hr noshade size=4><a href="http://www.htdig.org"><IMG SRC="../about/images/htdig.gif" align=bottom alt="&quot;ht//Dig&quot; logo in red lettering with a small magnifying glass icon, set against a dark background." border=0></a></body></html>
